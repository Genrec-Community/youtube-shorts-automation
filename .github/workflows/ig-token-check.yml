name: Inspect Instagram token (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ig-post
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_EXPECTED_USERNAME: things._.explained
    steps:
      - name: Verify token and account linkage (prints structure only, never tokens)
        run: |
          python3 - <<'DBG_PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          tok = os.environ["IG_ACCESS_TOKEN"]
          def get(path):
              url = "https://graph.facebook.com/v23.0" + path + ("&" if "?" in path else "?") + "access_token=" + urllib.parse.quote(tok)
              try:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try:
                      body = json.loads(e.read().decode() or "{}")
                  except Exception:
                      body = {}
                  return e.code, body
          def errline(tag, st, body):
              err = (body or {}).get("error", {}) if isinstance(body, dict) else {}
              print(tag, "http:", st, "| code:", err.get("code"), "| subcode:", err.get("error_subcode"),
                    "| type:", err.get("type"), "| msg:", str(err.get("message"))[:200])
          st, me = get("/me?fields=id,name")
          if st == 200:
              print("me ok | id:", me.get("id"), "| name:", me.get("name"))
          else:
              errline("me", st, me)
          st, perms = get("/me/permissions")
          if st == 200:
              for p in perms.get("data", []):
                  print("perm:", p.get("permission"), "=", p.get("status"))
          else:
              errline("permissions", st, perms)
          igid = os.environ.get("IG_USER_ID", "").strip()
          if igid:
              st, igu = get("/" + igid + "?fields=id,username")
              if st == 200:
                  print("ig_user ok | id:", igu.get("id"), "| username:", igu.get("username"))
              else:
                  errline("ig_user", st, igu)
          st, acc = get("/me/accounts?fields=name,instagram_business_account%7Bid,username%7D")
          if st == 200:
              for p in acc.get("data", []):
                  ig = p.get("instagram_business_account") or {}
                  print("page:", p.get("name"), "| ig_username:", ig.get("username"), "| ig_id:", ig.get("id"))
              if not acc.get("data"):
                  print("me/accounts ok but EMPTY page list")
          else:
              errline("me/accounts", st, acc)
          DBG_PY
