name: Post a finished video to Instagram as a Reel (manual)
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: raw.githubusercontent.com/Genrec-Community URL of the mp4 (leave empty when artifact_run_id is set)
        required: false
      artifact_run_id:
        description: Optional run id of this repo whose stickman-output artifact holds stickman.mp4
        required: false
      metadata_url:
        description: raw.githubusercontent.com/Genrec-Community URL of metadata.json (optional when artifact_run_id is set and the artifact holds metadata.json)
        required: false
permissions:
  contents: write
  actions: read
concurrency:
  group: ig-post
jobs:
  post:
    runs-on: ubuntu-latest
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch video and metadata (own org only)
        env:
          V: ${{ inputs.video_url }}
          M: ${{ inputs.metadata_url }}
          RID: ${{ inputs.artifact_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$IG_USER_ID" -a -n "$IG_ACCESS_TOKEN" || { echo "IG_USER_ID or IG_ACCESS_TOKEN secret missing"; exit 1; }
          P="https://raw.githubusercontent.com/Genrec-Community/"
          mkdir -p out dl
          if [ -n "$RID" ]; then
            case "$RID" in *[!0-9]*) echo "bad run id"; exit 1;; esac
            gh run download "$RID" -n stickman-output -D dl
            cp dl/stickman.mp4 out/video.mp4
            if [ -n "$M" ]; then
              case "$M" in "$P"*) ;; *) echo "metadata url not allowed"; exit 1;; esac
              curl -fsSL "$M" -o out/metadata.json
            elif [ -f dl/metadata.json ]; then
              cp dl/metadata.json out/metadata.json
              echo "metadata taken from the run artifact"
            else
              echo "no metadata_url given and artifact has no metadata.json"; exit 1
            fi
          else
            test -n "$M" || { echo "metadata_url required without artifact_run_id"; exit 1; }
            case "$M" in "$P"*) ;; *) echo "metadata url not allowed"; exit 1;; esac
            case "$V" in "$P"*) ;; *) echo "video url not allowed"; exit 1;; esac
            curl -fsSL "$V" -o out/video.mp4
            curl -fsSL "$M" -o out/metadata.json
          fi
      - name: Host the mp4 on a release and publish the Reel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="reel-manual-$(date +%Y%m%d-%H%M%S)-${{ github.run_id }}"
          gh release create "$TAG" --repo "${{ github.repository }}" --title "Reel $TAG" --notes "Hosted for Instagram Reels publishing." out/video.mp4
          URL=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets[0].browser_download_url')
          echo "hosted at: $URL"
          curl -sIL "$URL" | grep -iE "^HTTP|content-type|content-length" | head -6
          CAPTION=$(python3 -c 'import json; print(json.load(open("out/metadata.json")).get("exact_caption", ""))')
          python3 scripts/upload_instagram.py --video-url "$URL" --metadata out/metadata.json --caption "$CAPTION"
          cat out/instagram_result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instagram-result
          path: out/instagram_result.json
