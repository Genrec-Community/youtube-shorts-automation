          yt = json.load(open('/home/runner/w/out/youtube_result.json'))
          ist = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=5, minutes=30))).date().isoformat()
          path = os.path.join(os.environ['GITHUB_WORKSPACE'], 'state', 'receipts.csv')
          os.makedirs(os.path.dirname(path), exist_ok=True)
          new = not os.path.exists(path)
          with open(path, 'a', newline='', encoding='utf-8') as f:
              w = csv.writer(f)
              if new:
                  w.writerow(['date', 'run_id', 'topic_id', 'yt_status', 'yt_url', 'ig_status', 'ig_permalink'])
              w.writerow([ist, os.environ.get('RUN_ID', ''), open('/home/runner/w/topic_id.txt').read().strip(),
                          yt.get('status', ''), yt.get('url', ''), '', ''])
          print('receipt recorded:', yt.get('status'), yt.get('url'))
          REC_PY
          cd "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/receipts.csv
          git commit -q -m "receipt: yt run ${{ github.run_id }} [skip ci]" || echo "nothing to commit"
          for i in 1 2; do git pull --rebase --autostash -q origin main && git push -q && break || { echo "receipt push attempt $i failed"; sleep 5; }; done
      - name: Publish Reel to Instagram (only when explicitly enabled)
        if: steps.pick.outputs.skip != 'true' && vars.IG_UPLOAD_ENABLE == 'true' && env.IG_USER_ID != '' && env.IG_ACCESS_TOKEN != ''
        working-directory: /home/runner/w
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          test -f out/stickman.mp4 || { echo "no rendered video; skipping Instagram"; exit 0; }
          TAG="reel-stick-$(date +%Y%m%d-%H%M%S)-${{ github.run_id }}"
          gh release create "$TAG" --repo "${{ github.repository }}" --title "Reel $TAG" --notes "Auto-hosted render for Instagram Reels publishing (Meta fetches the asset URL)." out/stickman.mp4
          URL=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets[0].browser_download_url')
          echo "hosted at: $URL"
          python3 "$GITHUB_WORKSPACE/scripts/upload_instagram.py" --video-url "$URL" --metadata out/metadata.json || echo "instagram publish attempt 1 failed (see instagram_result.json)"
          export URL
          python3 - <<'IGFIX_PY'
          import json, os, subprocess, sys, urllib.request, urllib.parse
          p = '/home/runner/w/out/instagram_result.json'
          if not os.path.exists(p):
              sys.exit(0)
          r = json.load(open(p))
          st = r.get('status')
          if st == 'published':
              sys.exit(0)
          if st == 'token_invalid_or_expired':
              print('token problem; no retry, the flag step will open an issue')
              sys.exit(0)
          tok = os.environ.get('IG_ACCESS_TOKEN', '')
          cid = r.get('container_id')
          retry = False
          if cid:
              try:
                  url = 'https://graph.facebook.com/v23.0/%s?fields=status_code&access_token=%s' % (cid, urllib.parse.quote(tok))
                  with urllib.request.urlopen(url, timeout=30) as resp:
                      code = json.loads(resp.read().decode()).get('status_code')
                  print('container', cid, 'status_code:', code)
                  if code == 'PUBLISHED':
                      uid = r.get('account_id') or os.environ.get('IG_USER_ID', '')
                      permalink = ''
                      try:
                          murl = 'https://graph.facebook.com/v23.0/%s/media?fields=permalink&limit=1&access_token=%s' % (uid, urllib.parse.quote(tok))
                          with urllib.request.urlopen(murl, timeout=30) as resp:
                              permalink = (json.loads(resp.read().decode()).get('data') or [{}])[0].get('permalink', '')
                      except Exception as e:
                          print('permalink lookup failed:', str(e)[:150])
                      json.dump({'status': 'published', 'url': permalink, 'container_id': cid, 'account_id': uid, 'reconciled': True}, open(p, 'w'))
                      print('reconciled: container published')
                      sys.exit(0)
                  retry = code in ('ERROR', 'EXPIRED')
              except Exception as e:
                  print('container status check failed (unknown outcome; failing closed):', str(e)[:150])
                  retry = False
          else:
              retry = st in ('container_failed', 'publish_failed', 'account_lookup_failed')
          if not retry:
              print('no retry (outcome unknown or not retriable); leaving failed status in place')
              sys.exit(0)
          print('definitive failure; retrying publish once')
          r2 = subprocess.run(['python3', os.environ['GITHUB_WORKSPACE'] + '/scripts/upload_instagram.py',
                               '--video-url', os.environ['URL'], '--metadata', 'out/metadata.json'], cwd='/home/runner/w')
          print('retry exit code:', r2.returncode)
          IGFIX_PY
          python3 - <<'REC_PY'
          import csv, json, os, datetime
          p = '/home/runner/w/out/instagram_result.json'
          if not os.path.exists(p):
              raise SystemExit(0)
          ig = json.load(open(p))
          ist = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=5, minutes=30))).date().isoformat()
          path = os.path.join(os.environ['GITHUB_WORKSPACE'], 'state', 'receipts.csv')
          os.makedirs(os.path.dirname(path), exist_ok=True)
          rows = []
          if os.path.exists(path):
              rows = [r for r in csv.reader(open(path, encoding='utf-8')) if r]
          hdr = ['date', 'run_id', 'topic_id', 'yt_status', 'yt_url', 'ig_status', 'ig_permalink']
          if not rows:
              rows = [hdr]
          rid = os.environ.get('RUN_ID', '')
          hit = None
          for r in rows[1:]:
              if len(r) >= 2 and r[1] == rid:
                  hit = r
          if hit is None:
              hit = [ist, rid, open('/home/runner/w/topic_id.txt').read().strip() if os.path.exists('/home/runner/w/topic_id.txt') else '', '', '', '', '']
              rows.append(hit)
          while len(hit) < 7:
              hit.append('')
          hit[5] = ig.get('status', '')
          hit[6] = ig.get('url', '')
          with open(path, 'w', newline='', encoding='utf-8') as f:
              csv.writer(f).writerows(rows)
          print('receipt updated: ig', ig.get('status'), ig.get('url'))
          REC_PY
          cd "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/receipts.csv
          git commit -q -m "receipt: ig run ${{ github.run_id }} [skip ci]" || echo "nothing to commit"
          for i in 1 2; do git pull --rebase --autostash -q origin main && git push -q && break || { echo "receipt push attempt $i failed"; sleep 5; }; done
      - name: Flag Instagram token expiry (never fails the job)
        if: steps.pick.outputs.skip != 'true' && always() && !cancelled()
        working-directory: /home/runner/w
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f out/instagram_result.json ] && grep -q 'token_invalid_or_expired' out/instagram_result.json; then
            export TITLE="Instagram access token invalid or expired - Reels cross-post halted"
            existing=$(gh issue list --state open --limit 50 --json title --jq '[.[] | select(.title == env.TITLE)] | length' 2>/dev/null || echo 0)
            if [ "$existing" = "0" ]; then
              gh issue create --title "$TITLE" --body "Instagram Reels publishing failed with token_invalid_or_expired. The IG access token needs renewal. YouTube uploads are unaffected. Close after the token is renewed."
            else
              echo "instagram token issue already open"
            fi
          fi
          exit 0
      - name: Record run state in queue
        if: steps.pick.outputs.skip != 'true' && always()
        run: |
          python3 - <<'STATE_PY'
          import csv, json, os, datetime, sys
          if not os.path.exists('/home/runner/w/topic_id.txt'):
              print('no topic was picked; nothing to record')
              sys.exit(0)
          tid = open('/home/runner/w/topic_id.txt', encoding='utf-8').read().strip()
          if tid == 'manual':
              print('manual run; queue untouched')
              sys.exit(0)
          today = datetime.date.today().isoformat()
          yt = {}
          try:
              yt = json.load(open('/home/runner/w/out/youtube_result.json'))
          except Exception:
              pass
          rendered = os.path.exists('/home/runner/w/out/stickman.mp4')
          rows = [r for r in csv.DictReader(open('stickman-topics.csv', encoding='utf-8')) if None not in r]
          job_ok = os.environ.get('JOB_STATUS', '') == 'success'
          upload_failed = os.path.exists('/home/runner/w/upload_failed.flag')
          if rendered and upload_failed:
              status = 'upload_failed'
          elif rendered and job_ok:
              status = 'done'
          else:
              status = 'failed'
          final_status = status
          for r in rows:
              if r['id'] == tid:
                  try:
                      r['style'] = open('/home/runner/w/style.txt', encoding='utf-8').read().strip().upper() or r['style']
                  except Exception:
                      pass
                  prev = (r.get('notes') or '')
                  if status == 'failed' and not prev.startswith('retry-2'):
                      n = 2 if prev.startswith('retry-1') else 1
                      r['status'] = 'pending'
                      r['finished_at'] = ''
                      r['youtube_url'] = ''
                      r['notes'] = 'retry-%d: run %s failed (no valid video)' % (n, os.environ.get('RUN_ID', ''))
                      final_status = 'failed (requeued as retry-%d)' % n
                  else:
                      r['status'] = status
                      r['finished_at'] = today
                      r['youtube_url'] = yt.get('url', '')
                      if status == 'upload_failed':
                          r['notes'] = 'rendered, upload failed (video in artifact stickman-output of run %s)' % os.environ.get('RUN_ID', '')
                      elif status == 'failed':
                          r['notes'] = 'failed after two retries, not requeued'
                      else:
                          r['notes'] = ('uploaded ' + yt.get('status', '') + (' ' + yt.get('privacy', '') if yt.get('privacy') else '')) if yt else 'rendered, no upload result'
          with open('stickman-topics.csv', 'w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=rows[0].keys())
              w.writeheader(); w.writerows(rows)
          os.makedirs('state', exist_ok=True)
          new = not os.path.exists('state/stickman-runs.csv')
          with open('state/stickman-runs.csv', 'a', newline='', encoding='utf-8') as f:
              w = csv.writer(f)
              if new:
                  w.writerow(['date', 'topic_id', 'topic', 'style', 'run_url', 'render', 'upload_status', 'youtube_url'])
              w.writerow([today, tid, open('/home/runner/w/topic.txt', encoding='utf-8').read().strip(),
                          open('/home/runner/w/style.txt', encoding='utf-8').read().strip(),
                          os.environ.get('RUN_URL', ''), final_status, yt.get('status', 'disabled'), yt.get('url', '')])
          print('queue updated:', tid, final_status)
          STATE_PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stickman-topics.csv || true
          [ -f state/stickman-runs.csv ] && git add state/stickman-runs.csv || true
          git commit -m "stickman run: topic ${{ steps.pick.outputs.topic_id }} [skip ci]" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase --autostash -q origin main && git push && break || { echo "push attempt $i failed"; sleep 5; }; done
          if [ -n "$(git log origin/main..HEAD --oneline 2>/dev/null)" ]; then
            echo "queue state push did not land; opening an issue"
            export TITLE2="Stickman queue state push failed - duplicate risk next slot"
            existing=$(gh issue list --state open --limit 50 --json title --jq '[.[] | select(.title == env.TITLE2)] | length' 2>/dev/null || echo 0)
            if [ "$existing" = "0" ]; then
              gh issue create --title "$TITLE2" --body "The record step could not push stickman-topics.csv/state updates after run $RUN_URL . The failed topic may be picked again and re-uploaded as a duplicate. Inspect and push the queue state, then close."
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
      - name: Open an issue when the run fails
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Stickman short run failed (run #${{ github.run_number }})"
        run: |
          TOPIC=$(cat /home/runner/w/topic.txt 2>/dev/null || echo unknown)
          existing=$(gh issue list --state open --limit 50 --json title --jq '[.[] | select(.title == env.TITLE)] | length' 2>/dev/null || echo 0)
          if [ "$existing" = "0" ]; then
            gh issue create --title "$TITLE" --body "The stickman-shorts workflow failed on topic: $TOPIC . Run: $RUN_URL . The queue requeues a failed topic up to two times on later scheduled runs; check the job log for the failing step. Close this issue once noted."
          else
            echo "a failure issue is already open; not duplicating"
          fi
      - name: Finish clock and summary
        if: always()
        run: |
          if [ -f $HOME/w/out/timing.txt ]; then
            s=$(head -1 $HOME/w/out/timing.txt | cut -d' ' -f2)
            echo "total_seconds_since_start_step $(( $(date +%s) - s ))" >> $HOME/w/out/timing.txt
            cat $HOME/w/out/timing.txt
            { echo "### Stickman short run"; echo; echo "- Topic: $(cat $HOME/w/topic.txt 2>/dev/null || echo none)"; echo "- Style: $(cat $HOME/w/style.txt 2>/dev/null || echo none)"; cat $HOME/w/out/youtube_result.json 2>/dev/null || echo '- YouTube: upload step disabled or not run'; } >> $GITHUB_STEP_SUMMARY
            jq -r '"", "- Title: " + (.title // ""), "- Title options: " + ((.titles // {}) | [.[]] | join(" | ")), "", "Description:", (.description // ""), "", "- Hashtags: " + ((.hashtags // []) | map("#" + .) | join(" "))' $HOME/w/out/metadata.json >> $GITHUB_STEP_SUMMARY || true
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.pick.outputs.skip != 'true'
        with:
          name: stickman-output
          path: /home/runner/w/out
          retention-days: 14
