name: stickman-shorts
on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional: force this exact topic text instead of picking from stickman-topics.csv'
        required: false
        default: ''
      style:
        description: 'Style for a forced topic: B7 (Pixel Theater) or A5 (Historical Cartoon)'
        required: false
        default: 'B7'
  # Two runs daily (external cron-job.org dispatch): ~08:47 IST (03:17 UTC) and ~17:47 IST (12:17 UTC).
  # Style rotation since 2026-11-19 (user-approved): ONLY B7 Pixel Theater and A5 Historical Cartoon, alternating by the style column of stickman-topics.csv.
  # Off-peak minute: GitHub drops scheduled runs under load at :00/:30.
  # Each run makes ONE vertical Short (next pending topic in stickman-topics.csv). Scripts by DeepSeek free via OpenCode; narration tiny-voca F2.
  # schedule: disabled 2026-11-19 - external cron-job.org triggers fire workflow_dispatch at 03:17 and 12:17 UTC (08:47 / 17:47 IST); GitHub's own scheduler silently skipped runs.
permissions:
  contents: write
  issues: write
concurrency:
  group: stickman-shorts
  cancel-in-progress: false
env:
  YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
  YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
  YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
  IG_USER_ID: ${{ secrets.IG_USER_ID }}
  IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pick next topic from the stickman queue (slot style pool)
        id: pick
        run: |
          python3 - <<'PICK_PY'
          import csv, os, sys
          import datetime
          forced = os.environ.get('FORCED_TOPIC', '').strip()
          forced_style = (os.environ.get('FORCED_STYLE', '').strip() or 'B7').upper()
          sched = os.environ.get('SCHEDULE', '')
          pool = {'B7', 'A5', 'H1', 'AUTO'}
          os.makedirs('/home/runner/w', exist_ok=True)
          if forced:
              open('/home/runner/w/topic.txt', 'w').write(forced + '\n')
              open('/home/runner/w/style.txt', 'w').write(forced_style + '\n')
              open('/home/runner/w/topic_id.txt', 'w').write('manual')
              open(os.environ['GITHUB_OUTPUT'], 'a').write('skip=false\ntopic_id=manual\n')
              print('Forced topic:', forced, '| style:', forced_style)
              sys.exit(0)
          rows = [r for r in csv.DictReader(open('stickman-topics.csv', encoding='utf-8')) if None not in r]
          closed = {r['topic'].strip().lower() for r in rows if r['status'] in ('done', 'in_progress')}
          # Duplicate-publish guard: never re-pick a topic already uploaded today per the run ledger.
          ist_today = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=5, minutes=30))).date().isoformat()
          uploaded_today = set()
          try:
              for rr in csv.DictReader(open('state/stickman-runs.csv', encoding='utf-8')):
                  if rr.get('date') == ist_today and rr.get('upload_status') == 'uploaded':
                      uploaded_today.add(rr.get('topic_id'))
          except FileNotFoundError:
              pass
          try:
              for rr in csv.DictReader(open('state/receipts.csv', encoding='utf-8')):
                  if rr.get('date') == ist_today and rr.get('yt_status') == 'uploaded':
                      uploaded_today.add(rr.get('topic_id'))
          except FileNotFoundError:
              pass
          if uploaded_today:
              print('already uploaded today, excluded:', sorted(uploaded_today))
          # Receipt reconciliation (any date): an uploaded receipt means the topic is already published.
          yt_done = {}
          try:
              for rr in csv.DictReader(open('state/receipts.csv', encoding='utf-8')):
                  if rr.get('yt_status') == 'uploaded' and rr.get('topic_id'):
                      yt_done[rr['topic_id']] = rr
          except FileNotFoundError:
              pass
          repaired = False
          for r in rows:
              notes = (r.get('notes') or '').strip()
              if r['status'] in ('pending', 'failed') and r['id'] in yt_done and (not notes or notes.startswith('retry-')):
                  rec = yt_done[r['id']]
                  r['status'] = 'done'
                  r['finished_at'] = rec.get('date') or ist_today
                  r['youtube_url'] = rec.get('yt_url', '')
                  r['notes'] = 'reconciled: already uploaded (receipt run %s)' % rec.get('run_id', '')
                  repaired = True
                  print('reconciled from receipt:', r['id'], r['youtube_url'])
          if repaired:
              closed = {r['topic'].strip().lower() for r in rows if r['status'] in ('done', 'in_progress')}
          # Slot-aware pick (from 2026-11-23): the IST time of the run decides the category.
          # 'slot' column: m = morning (08:47 trigger), a = afternoon (13:47), e = evening (17:47); letters combine ('me' = morning or evening); blank = any slot.
          # A failed topic stays pending in its own category, so a retry never shifts the other categories.
          import datetime
          ist = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=5, minutes=30)))
          mins = ist.hour * 60 + ist.minute
          cur = 'm' if 240 <= mins < 690 else ('a' if 690 <= mins < 960 else 'e')
          def ok_slot(r):
              sl = (r.get('slot') or '').strip().lower()
              return (not sl) or (cur in sl)
          print('IST now', ist.strftime('%Y-%m-%d %H:%M'), '-> slot', cur)
          chosen = next((r for r in rows if r['status'] == 'pending' and r['style'].strip().upper() in pool
                         and ok_slot(r) and r['topic'].strip().lower() not in closed
                         and r['id'] not in uploaded_today), None)
          if repaired:
              with open('stickman-topics.csv', 'w', newline='', encoding='utf-8') as f:
                  w = csv.DictWriter(f, fieldnames=rows[0].keys())
                  w.writeheader(); w.writerows(rows)
              open('/home/runner/w/reconciled.flag', 'w').write('1')
          if not chosen:
              print('Queue empty for slot', cur)
              open('/home/runner/w/pool.txt', 'w').write('slot-' + cur)
              open(os.environ['GITHUB_OUTPUT'], 'a').write('skip=true\n')
              sys.exit(0)
          open('/home/runner/w/topic.txt', 'w').write(chosen['topic'].strip() + '\n')
          open('/home/runner/w/style.txt', 'w').write(chosen['style'].strip().upper() + '\n')
          open('/home/runner/w/topic_id.txt', 'w').write(chosen['id'])
          open(os.environ['GITHUB_OUTPUT'], 'a').write('skip=false\ntopic_id=%s\n' % chosen['id'])
          print('Chosen:', chosen['id'], chosen['style'], chosen['topic'])
          PICK_PY
          [ -f /home/runner/w/topic_id.txt ] || exit 0
          if [ -f /home/runner/w/reconciled.flag ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add stickman-topics.csv
            git commit -q -m "queue: reconcile upload receipts [skip ci]" || echo "nothing to commit"
            for i in 1 2; do git pull --rebase --autostash -q origin main && git push -q && break || { echo "reconcile push attempt $i failed"; sleep 5; }; done
          fi
          python3 - <<'INPROG_PY'
          import csv
          tid = open('/home/runner/w/topic_id.txt').read().strip()
          rows = list(csv.DictReader(open('stickman-topics.csv', encoding='utf-8')))
          for r in rows:
              if r['id'] == tid:
                  r['status'] = 'in_progress'
          with open('stickman-topics.csv', 'w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=rows[0].keys())
              w.writeheader(); w.writerows(rows)
          INPROG_PY
        env:
          FORCED_TOPIC: ${{ inputs.topic }}
          FORCED_STYLE: ${{ inputs.style }}
          SCHEDULE: ${{ github.event.schedule }}
      - name: Notify when the stickman queue is empty for this slot
        if: steps.pick.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          POOL=$(cat /home/runner/w/pool.txt 2>/dev/null || echo unknown)
          TITLE="Stickman topic queue empty for slot ($POOL) - add topics to stickman-topics.csv"
          existing=$(gh issue list --state open --limit 50 --json title --jq '[.[] | select(.title == env.TITLE)] | length' 2>/dev/null || echo 0)
          if [ "$existing" = "0" ]; then
            gh issue create --title "$TITLE" --body "The stickman-shorts run found no pending $POOL topics in stickman-topics.csv, so no video was generated. Add new rows with status pending and the next scheduled run will pick them up. Close this issue after adding topics."
          else
            echo "queue-empty issue already open; not duplicating"
          fi
      - name: Install system + media deps
        if: steps.pick.outputs.skip != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
          sudo fallocate -l 6G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile || echo 'swap not enabled'
          npm install -g opencode-ai@1.19.6
          mkdir -p $HOME/w/project $HOME/w/out $HOME/w/tmp
          echo "start $(date +%s)" > $HOME/w/out/timing.txt
      - name: Agent chooses the style for this topic (AUTO rows only)
        if: steps.pick.outputs.skip != 'true'
        run: |
          cd $HOME/w
          if [ "$(cat style.txt)" = "AUTO" ]; then
            T="$(cat topic.txt)"; ID="$(cat topic_id.txt)"
            rm -f choice.txt
            P="Pick the single best visual template for a 45-second vertical explainer Short on this topic: ${T}. Options: A5 = historical cartoon (people, eras, human stories, history, society, health and the body); B7 = pixel-art theater (games, tech, process, cause and effect, small characters acting things out); H1 = Bauhaus poster motion graphics, no characters (abstract ideas, math, physics, light and sound, economics, systems, data). Write ONLY the code A5 or B7 or H1 into the file /home/runner/w/choice.txt, nothing else, then stop."
            ( OPENCODE_CONFIG_CONTENT='{"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}' opencode run -m opencode/deepseek-v4.1-flash-free "$P" > choose.log 2>&1 & )
            for _ in $(seq 1 18); do [ -s choice.txt ] && break; sleep 5; done
            sleep 2; pkill -9 -f "opencode run" || true
            C="$(tr -dc 'A-Za-z0-9' < choice.txt 2>/dev/null | tr a-z A-Z | head -c 2)"
            case "$C" in A5|B7|H1) echo "agent chose $C";; *) N=$(echo "$ID" | tr -dc 0-9); C=$(echo "A5 B7 H1" | cut -d' ' -f$(( (${N:-0} % 3) + 1 ))); echo "agent choice unusable, fallback by id: $C";; esac
            echo "$C" > style.txt
          fi
          echo "STYLE=$(cat style.txt)"
      - name: Fetch the stickman-video-director skill
        if: steps.pick.outputs.skip != 'true'
        run: |
          git clone --depth 1 https://github.com/kaomei/stickman-video-director $HOME/w/svd
          cd $HOME/w/svd/skills/directing-stickman-videos
          npm ci
          node scripts/autopilot.mjs doctor || true
          if [ "$(cat $HOME/w/style.txt 2>/dev/null)" = "H1" ]; then
            git clone --depth 1 https://github.com/alchaincyf/huashu-art-motion $HOME/w/hm
            sudo apt-get install -y fonts-noto-cjk || true
            pip install uv playwright
            python3 -m playwright install --with-deps chromium
          fi
      - name: Cache pip + TTS models
        if: steps.pick.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            /home/runner/w/kokoro.onnx
            /home/runner/w/voices.bin
            /home/runner/w/tinyvoca
          key: stickman-tts-v2
      - name: Prepare local narration route (edge-tts Andrew default, tiny-voca fallback, free)
        if: steps.pick.outputs.skip != 'true'
        run: |
          pip install kokoro-onnx==0.6.1 soundfile==0.14.0 edge-tts git+https://github.com/n4ze3m/dizione
          cd $HOME/w
          [ -s kokoro.onnx ] || curl -fsSL -o kokoro.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -s voices.bin ] || curl -fsSL -o voices.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          mkdir -p tinyvoca/phonemizer
          [ -s tinyvoca/model.onnx ] || curl -fsSL -o tinyvoca/model.onnx https://huggingface.co/n4ze3m/tiny-voca/resolve/main/onnx/model.onnx
          [ -s tinyvoca/config.json ] || curl -fsSL -o tinyvoca/config.json https://huggingface.co/n4ze3m/tiny-voca/resolve/main/config.json
          for f in align.json g2p.json g2p.npz homographs.json lexicon.json lexicon.tsv sources.json; do
            [ -s "tinyvoca/phonemizer/$f" ] || curl -fsSL -o "tinyvoca/phonemizer/$f" "https://huggingface.co/n4ze3m/tiny-voca/resolve/main/phonemizer/$f"
          done
          cat > $HOME/w/tts.py <<'TTS_PY'
          import os, re, sys
          import numpy as np, soundfile as sf

          ENGINE = os.environ.get('TTS_ENGINE', 'edge').strip().lower()
          VOCA_DIR = os.environ.get('TINYVOCA_DIR', '/home/runner/w/tinyvoca')
          KOKORO_ONNX = os.environ.get('KOKORO_ONNX', '/home/runner/w/kokoro.onnx')
          KOKORO_VOICES = os.environ.get('KOKORO_VOICES', '/home/runner/w/voices.bin')

          def synth_kokoro(text, out, voice):
              from kokoro_onnx import Kokoro
              k = Kokoro(KOKORO_ONNX, KOKORO_VOICES)
              s, sr = k.create(text, voice=voice or 'am_michael', speed=1.12, lang='en-us')
              sf.write(out, s, sr)
              return len(s) / sr

          def synth_tinyvoca(text, out, voice):
              os.environ.setdefault('DIZIONE_DATA', VOCA_DIR + '/phonemizer')
              import onnxruntime as ort, dizione
              session = ort.InferenceSession(VOCA_DIR + '/model.onnx')
              vid = 1 if (voice or '').upper() == 'M2' else 0
              one = lambda v: np.array([v], dtype=np.float32)
              chunks = []
              for part in re.split(r'(?<=[.!?])\s+', text.strip()):
                  part = part.strip()
                  if not part:
                      continue
                  if part[-1] not in '.!?':
                      part += '.'
                  ph = dizione.phonemize(part)
                  audio, _ = session.run(None, {
                      'tokens': np.array([ph.ids], dtype=np.int64),
                      'stress': np.array([ph.stress], dtype=np.int64),
                      'voice': np.array([vid], dtype=np.int64),
                      'speed': one(1.0),
                      'pitch_shift': one(0.0),
                      'pitch_range': one(1.0),
                  })
                  chunks.append(audio[0])
              if not chunks:
                  raise SystemExit('nothing pronounceable in text')
              wave = np.concatenate(chunks)
              peak = float(np.abs(wave).max())
              if peak > 0.99:
                  wave = wave * (0.99 / peak)
              sf.write(out, wave, 24000)
              return len(wave) / 24000

          def synth_edge(text, out):
              import asyncio, time, subprocess, tempfile
              import edge_tts
              mp3 = os.path.join(tempfile.gettempdir(), 'edge_tts.mp3')
              last = None
              for _ in range(8):
                  try:
                      if os.path.exists(mp3):
                          os.remove(mp3)
                      asyncio.run(edge_tts.Communicate(text, 'en-US-AndrewMultilingualNeural', rate='+12%').save(mp3))
                      if os.path.getsize(mp3) > 2000 and subprocess.run(['ffmpeg', '-y', '-v', 'error', '-i', mp3, '-ar', '24000', '-ac', '1', out]).returncode == 0:
                          return sf.info(out).duration
                  except Exception as e:
                      last = e
                  time.sleep(3)
              raise RuntimeError('edge-tts gave no audio after 8 attempts: %s' % last)

          text, out = sys.argv[1], sys.argv[2]
          voice = sys.argv[3] if len(sys.argv) > 3 else None
          used = ENGINE
          if ENGINE == 'kokoro':
              secs = synth_kokoro(text, out, voice)
          elif ENGINE == 'edge':
              try:
                  secs = synth_edge(text, out)
              except Exception as e:
                  print('edge-tts failed, falling back to tiny-voca:', str(e)[:200])
                  used = 'tinyvoca'
                  secs = synth_tinyvoca(text, out, voice or 'F2')
          else:
              secs = synth_tinyvoca(text, out, voice or 'F2')
          # Voice polish (user-requested): highpass, EQ, compressor, tighten pauses. Falls back to the raw narration if ffmpeg fails.
          import subprocess, tempfile
          VOICE_CHAIN = ('highpass=f=80,equalizer=f=140:t=q:w=1.2:g=3.5,equalizer=f=4500:t=q:w=1.5:g=2.5,'
                         'acompressor=threshold=-18dB:ratio=3:attack=5:release=50,'
                         'silenceremove=stop_periods=-1:stop_duration=0.12:stop_threshold=-45dB,alimiter=limit=0.95')
          EDGE_CHAIN = VOICE_CHAIN.replace('stop_duration=0.12', 'stop_duration=0.35')
          raw_tts = os.path.join(tempfile.gettempdir(), 'raw_tts.wav')
          os.replace(out, raw_tts)
          try:
              ok = subprocess.run(['ffmpeg', '-y', '-v', 'error', '-i', raw_tts, '-af', (EDGE_CHAIN if used == 'edge' else VOICE_CHAIN), out]).returncode == 0 and sf.info(out).duration > 0.2
          except Exception:
              ok = False
          if not ok:
              print('voice filter failed, using raw narration')
              os.replace(raw_tts, out)
          secs = sf.info(out).duration
          print('wrote', out, round(secs, 2), 'seconds via', used)
          TTS_PY
          python3 $HOME/w/tts.py 'Narration route check.' $HOME/w/out/tts-check.wav
      - name: OpenCode directs and renders the stickman Short (deepseek-v4.1-flash-free)
        if: steps.pick.outputs.skip != 'true'
        working-directory: /home/runner/w
        run: |
          TOPIC="$(cat $HOME/w/topic.txt)"; STYLE="$(cat $HOME/w/style.txt)"
          SKILL_DIR=/home/runner/w/svd/skills/directing-stickman-videos; KIND="stickman explainer Short"
          case "$STYLE" in
            A5) STYLE_NAME="Style 5 Historical Cartoon (code-rendered approximation)"; STYLE_REF="references/historical-cartoon.md and references/a1-a5-direction.md (the drawing grammar and era guidance only)"
                ROUTE="A5 is one of the Skill's A (Model Engine) styles, which normally depend on external AI video generation. That is NOT available here (free-only, headless CI). Build the video with project-local code: draw each scene as 2D vector/canvas frames at native 1080x1920 (the Skill's node runtime has @napi-rs/canvas and sharp; SVG rasterized is fine) following the style's drawing grammar (character look, palette, painted-style backgrounds, expressive simple faces, caption-safe layout), animate with real motion, mux with the narration and a locally synthesized quiet music bed, encode with ffmpeg. Render at the full 1080x1920 from the start; do not drop to 720p for speed (if it is slow, simplify scenes instead). State plainly in NOTES.md that this is a code-rendered approximation of the style, not generated video." ;;
            H1) SKILL_DIR=/home/runner/w/hm; KIND="explainer Short with no characters (Bauhaus poster motion graphics)"; STYLE_NAME="H1 Bauhaus Poster Motion (huashu-art-motion)"; STYLE_REF="its track steps: shot list template, storyboard lint, then the engine"
                ROUTE="HARD ORDER OF WORK FOR H1: as soon as the narration script is final and the narration wav is measured, write /home/runner/w/out/metadata.json and /home/runner/w/out/NOTES.md (first version) BEFORE building scenes or rendering anything; update NOTES.md at the end. The skill film_gate result yellow is ACCEPTABLE: make at most ONE fix pass on its findings, then ship the video. Never tune the gate beyond that, a late video with no metadata counts as a failed run. H1 uses the installed huashu-art-motion skill at /home/runner/w/hm INSTEAD of the stickman Skill (ignore any mention of the stickman Skill below). Work in the skill's track: write the shot list per references/shot-list template, lock ONE visual language for the whole film (flat 1920s Bauhaus poster look: cream paper, ink-black geometry, flat red/blue/yellow accents, thick rules, no gradients, no people), run scripts/storyboard_lint.py, copy scripts/engine into the project, build about 10 custom scenes as a film folder under engine/demos/<name>/, render with: cd <project>/engine && uv run --with playwright python render.py --film demos/<name> --width 1080 --height 1920 --fps 30 --crf 16 --out /home/runner/w/tmp/silent.mp4, then mux the narration (ffmpeg, -af apad, aac) to /home/runner/w/out/stickman.mp4 and run scripts/film_gate.py on it. All on-screen text and narration are English (the skill docs are Chinese). Captions are the narration verbatim, 2-3 word or clause chunks, large and readable on a cream strip. Skill human or independent review gates cannot run headless: record them in NOTES.md as bypassed." ;;
            *) STYLE="B7"; STYLE_NAME="B7 Pixel Theater"; STYLE_REF="references/b7-pixel-theater.md, references/b7-native-portrait.md, references/b7-review.md"
                ROUTE="B7 is a project-local code style: follow references/b7-pixel-theater.md and its 9:16 portrait contract (native 180x320 canvas enlarged 6x to 1080x1920), using the Skill's bundled pixel/ending helpers with reviewed project-local code. Inspect the bundled reference films as the reference mandates." ;;
          esac
          VARIETY=""
          if [ "$STYLE" != "H1" ]; then
            VARIETY=$(cat <<'VAR_EOF'
          Visual variety contract (this overrides any Skill wording about minimalist, dark-canvas, one-room or single-scene visuals; the Scenario-First hook may open in one place, but the explanation must travel):
          - Use at least 7 clearly different backdrops or sets (a different background, palette or composition, not just a changed prop), and change set every 4 to 6 seconds. Never hold the same background longer than 8 seconds.
          - Show the idea literally in the world: for each mechanism step go to a new location or a cutaway view (inside the device, a street, a different room, a landscape, a diagram stage). Bring in supporting characters and props where they help. The ending may return to the opening set to close the loop.
          - Give every beat a visual_cue that names its backdrop, and list the backdrops under a Backdrops heading in NOTES.md.
          - Keep all style rules, caption rules and the 1080x1920 portrait contract.
          VAR_EOF
            )
          fi
          cat > $HOME/w/PROMPT.md <<PROMPT_EOF
          You are producing ONE vertical YouTube Short with the installed Skill at ${SKILL_DIR} (read its SKILL.md, then the references it routes you to). Work non-interactively in this CI environment; ask no questions.

          Assignment: a ${KIND} of 40-52 seconds when narrated (130-150 words of narration, hard ceiling 55 seconds and 160 words), visual style: ${STYLE_NAME}, native 9:16 portrait at EXACTLY 1080x1920 pixels (never 720x1280 or any lower resolution), English, on this topic: "${TOPIC}"

          Script: FIRST read $GITHUB_WORKSPACE/skills/things-explained-scriptwriter/SKILL.md and follow it exactly. It is the channel scriptwriting skill (Scenario-First, Name-Drop, Mechanism, Loop; 130-150 words; TTS prosody rules; Part A narration text and Part B scene beats). Its structure, style and length rules win over anything else about script writing, including the older $GITHUB_WORKSPACE/framework.md (use framework.md only for its Section 4 audio and caption rules: 2-3 word caption chunks with one highlighted keyword, subtle background bed around -30dB, low-volume transition SFX). Do NOT apply framework.md Section 3 dark-canvas visual spec - the stickman styles keep their own look. The narration you synthesize must be the Part A text verbatim, and put Part A and Part B into NOTES.md. Where the skill conflicts with the editorial standard below on facts, caveats or sensitivity, the editorial standard wins.

          Hard constraints (these override any Skill suggestion):
          - Free-only: no paid or credentialed services, no API keys, no browser-driven generation, no external media downloads of unclear license.
          - Route: ${ROUTE}
          - Project folder: /home/runner/w/project (outside the Skill, as required). Final video must be exactly 1080x1920, 30 fps, H.264 + AAC; verify with ffprobe before finishing and re-render at full size if it is smaller.
          - Narration TTS: the project's configured local route is python3 /home/runner/w/tts.py "<text>" <out.wav> (the channel voice, already en-US neural at +12% with the channel EQ and light pause trimming applied automatically; do not post-process it, do not pick a voice or engine, and use the measured duration of the returned wav for timing). Do not attempt other TTS providers or engines. Voice cloning is forbidden.
          - Music/SFX: only what the Skill can synthesize locally or its own bundled assets; skip anything needing downloads or licenses. If you use any CC-BY asset, its full attribution line goes into metadata.json's description.
          - Human-approval gates: where the Skill requires a human preview or design approval that is impossible in this headless CI, proceed with the most conservative choice and record exactly which gates were bypassed in NOTES.md; never fabricate an approval or acceptance.
          - Keep total runtime under 105 minutes of compute. Do not stop to ask or to summarize before the MP4 exists: keep working with tools until it does. Use /home/runner/w/tmp for scratch files, never /tmp.
